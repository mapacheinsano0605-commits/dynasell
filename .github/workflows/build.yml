name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package -f DynaSell/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: DynaSell
          path: DynaSell/target/DynaSell.jar
